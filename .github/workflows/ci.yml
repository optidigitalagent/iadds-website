name: iADDS CI

on:
  push:
    branches: [main, 'codex/**', 'backend/nfc-card-intake']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SITE_URL: https://iadds-by-antonov-digital.funckj.chatgpt.site
      IADDS_MEDIA_MODE: production
      IADDS_REVIEW_BUILD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install isolated gateway dependencies
        run: npm ci --prefix services/lead-gateway
      - name: Audit, lint, types, tests and production Worker build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Confirm checks did not modify tracked source
        run: git diff --exit-code
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  nfc-backend:
    name: NFC isolated PostgreSQL and gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nfc_gateway_test
          POSTGRES_USER: nfc_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nfc_test -d nfc_gateway_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NFC_TEST_DATABASE_URL: postgres://nfc_test@127.0.0.1:5432/nfc_gateway_test
      NFC_TELEGRAM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/lead-gateway/package-lock.json
      - run: npm ci
        working-directory: services/lead-gateway
      - run: npm run typecheck && npm test && npm run build
        working-directory: services/lead-gateway
      - run: git diff --exit-code
